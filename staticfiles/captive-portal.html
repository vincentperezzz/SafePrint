<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SafePrint — Welcome</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a1a1a;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 48px 36px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.04),
                0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbc05, #f59e0b, #fbbc05);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            display: block;
            border-radius: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #111;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            background: #fbbc05;
            color: #000;
            border: none;
            padding: 18px 24px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #d9a404;
            position: relative;
            top: 0;
            letter-spacing: -0.3px;
        }

        .btn:active {
            top: 3px;
            box-shadow: 0 1px 0 #d9a404;
        }

        .wifi-icon {
            font-size: 40px;
            margin-bottom: 16px;
            display: block;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="wifi-icon">🖨️</span>
        <img src="https://safeprint.duckdns.org/static/assets/safeprint-logo.png"
             alt="SafePrint"
             class="logo"
             onerror="this.style.display='none'">
        <h1>Welcome to SafePrint</h1>
        <p class="subtitle">Your one-stop solution for secure<br>and efficient printing.</p>
        <a href="https://safeprint.duckdns.org/" class="btn">
            🖨️ Print using SAFEPRINT Printing Vendo
        </a>
        <div class="footer">
            Powered by SafePrint &copy; 2026
        </div>
    </div>
</body>
</html>
