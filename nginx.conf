server {
    listen 80;
    server_name nanoprint.duckdns.org nanoprint.com safeprint 192.168.0.100;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name pi.hole;
    return 301 https://pi.hole$request_uri;
}

server {
    listen 443 ssl;
    server_name pi.hole;
    
    ssl_certificate     /etc/ssl/certs/nanoprint.com.crt;
    ssl_certificate_key /etc/ssl/private/nanoprint.com.key;
    
    # Use standard ciphers for Pi-hole compatibility
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "HIGH:!aNULL:!MD5";
    
    # Simple reverse proxy for Pi-hole
    location / {
        # Direct proxy to Pi-hole on port 8081
        proxy_pass http://127.0.0.1:8081;
        
        # Important: Use pi.hole as the Host header
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Standard HTTP settings
        proxy_http_version 1.1;
        
        # Don't buffer for better real-time interaction
        proxy_buffering off;
        
        # Timeout settings
        proxy_read_timeout 600;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}

# Main website with Django
server {
    listen 443 ssl default_server;
    server_name nanoprint.duckdns.org nanoprint.com safeprint 192.168.0.100;

    # file uploads SIZE
    client_max_body_size 500M;

    # DIGITAL SIGNATURE using SSL provided by LETSENCRYPT with duckdns domain
    ssl_certificate /etc/letsencrypt/live/nanoprint.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanoprint.duckdns.org/privkey.pem;

    # Modified SSL settings for compatibility
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ChaCha20 ENCRYPTION
    ssl_ciphers "CHACHA20:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Static files - serve directly from the filesystem
    location /static/ {
        alias /home/safeprint/dev/SafePrint/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media files - serve directly from the filesystem
    location /media/ {
        alias /home/safeprint/dev/SafePrint/media/;
        expires 30d;
        access_log off;
    }
    
    # Redirect /admin/ to pi.hole domain for Pi-hole admin interface
    location /admin/ {
        return 301 https://pi.hole/admin/;
    }
    
    # Redirect all /admin paths to pi.hole domain
    location ^~ /admin {
        return 301 https://pi.hole/admin/;
    }
    
    # Alternate path for Pi-hole admin - redirect to pi.hole domain
    location /pihole-admin/ {
        return 301 https://pi.hole/admin/;
    }
    
    # Django admin path
    location /django-admin/ {
        proxy_pass http://unix:/home/safeprint/dev/SafePrint/safeprint.sock:/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint for dashboard auto-update
    location /sse/ {
        proxy_pass http://unix:/home/safeprint/dev/SafePrint/safeprint.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Django for all other paths - use Gunicorn via Unix socket
    location / {
        proxy_pass http://unix:/home/safeprint/dev/SafePrint/safeprint.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }
}

