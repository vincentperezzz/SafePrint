<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePrint - Continue</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #eee;
        }
        .logo {
            width: 180px;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background-color: #fbbc05;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 0 #d9a404;
            text-decoration: none;
            display: inline-block;
        }
        .manual-link {
            margin-top: 16px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }
        .manual-link a {
            color: #444;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="SafePrint Logo" class="logo">
        <h1>Continue to SafePrint</h1>
        <p>Use the SafePrint login page below if Safari did not continue automatically.</p>
        <a class="btn" href="$(link-login)">Print using SAFEPRINT Printing Vendo</a>
        <div class="manual-link">
            If needed, open <a href="http://172.16.0.1/login">http://172.16.0.1/login</a>
        </div>
    </div>
</body>
</html>
