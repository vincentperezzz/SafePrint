[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ========================================
# NGINX - Web Server
# ========================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# ========================================
# GUNICORN - Django Application Server
# ========================================
[program:gunicorn]
command=/home/safeprint/dev/SafePrint/gunicorn_docker.sh
user=safeprint
directory=/home/safeprint/dev/SafePrint
autostart=true
autorestart=true
priority=20
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/gunicorn-supervisor.log
stdout_logfile_maxbytes=10MB
environment=PATH="/home/safeprint/dev/SafePrint/venv/bin:%(ENV_PATH)s"

# ========================================
# PRINTER POLLING DAEMON
# ========================================
[program:printer_polling]
command=/home/safeprint/dev/SafePrint/scripts/poll_printers_daemon.sh
user=safeprint
directory=/home/safeprint/dev/SafePrint
autostart=true
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/home/safeprint/dev/SafePrint/logs/printer_polling_supervisor.log
stdout_logfile_maxbytes=5MB
environment=PATH="/home/safeprint/dev/SafePrint/venv/bin:%(ENV_PATH)s"

# ========================================
# MYSQL - Database Server
# ========================================
[program:mysql]
command=/usr/bin/pidproxy /var/run/mysqld/mysqld.pid /usr/sbin/mysqld
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/mysql/stdout.log
stderr_logfile=/var/log/mysql/stderr.log
