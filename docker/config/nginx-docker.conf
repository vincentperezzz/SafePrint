# SafePrint Docker Nginx Configuration
# Adapted from production configuration for Docker environment

# HTTP server - redirect to HTTPS (disabled in docker, use for production with SSL)
# server {
#     listen 80;
#     server_name localhost;
#     return 301 https://$host$request_uri;
# }

# Main HTTP server for Docker development
server {
    listen 80 default_server;
    server_name localhost safeprint 192.168.0.100;

    # File uploads SIZE (matching production)
    client_max_body_size 500M;

    # Static files - serve directly from source (dev mode)
    location /static/ {
        alias /home/safeprint/dev/SafePrint/static/;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Media files - serve directly from filesystem
    location /media/ {
        alias /home/safeprint/dev/SafePrint/media/;
        expires 30d;
        access_log off;
    }

    # Django admin path
    location /django-admin/ {
        proxy_pass http://unix:/home/safeprint/dev/SafePrint/safeprint.sock:/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint for dashboard auto-update
    location /sse/ {
        proxy_pass http://unix:/home/safeprint/dev/SafePrint/safeprint.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Django for all other paths - use Gunicorn via Unix socket
    location / {
        proxy_pass http://unix:/home/safeprint/dev/SafePrint/safeprint.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }
}

