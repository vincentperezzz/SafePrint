{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" href="{% static 'assets/nanoprint-logo.png' %}" type="image/x-icon">
    <title>{% block title %}SafePrint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Vertical Navbar -->
        <nav class="vertical-navbar">
            <div class="navbar-logo">
                <img src="{% static 'assets/nanoprint-logo.png' %}" alt="NanoPrint Logo">
                <div class="brand-text">
                    <span class="brand-title">NanoPrint</span>
                    <span class="brand-subtitle">Powered by SafePrint</span>
                </div>
            </div>
            <ul class="navbar-menu">
                <li><a href="#" class="navbar-item active"><img src="{% static 'assets/dashboard.svg' %}" alt="Dashboard Icon"> Dashboard</a></li>
                <li><a href="#" class="navbar-item"><img src="{% static 'assets/printing-queue.svg' %}" alt="Printing Queue Icon"> Printing Queue</a></li>
                <li><a href="#" class="navbar-item"><img src="{% static 'assets/print-completed.svg' %}" alt="Print Completed Icon"> Print Completed</a></li>
                <li><a href="#" class="navbar-item"><img src="{% static 'assets/printer-status.svg' %}" alt="Printer Status Icon"> Printer Status</a></li>
                <li><a href="#" class="navbar-item"><img src="{% static 'assets/account-settings.svg' %}" alt="Account Settings Icon"> Account Settings</a></li>
                <li><a href="#" class="navbar-item logout"><img src="{% static 'assets/logout.svg' %}" alt="Logout Icon"> Log out</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="dashboard-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
