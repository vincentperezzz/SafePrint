{% extends "layout.html" %}
{% load static %}

{% block title %}
SafePrint
{% endblock %}

{% block content %}

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h2>Log in</h2>
        </div>
            <div class="login-form">
            <form method="post">
                <div class="form-group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="24" viewBox="0 0 25 24" fill="none">
                        <path d="M20.5 21V19C20.5 17.9391 20.0786 16.9217 19.3284 16.1716C18.5783 15.4214 17.5609 15 16.5 15H8.5C7.43913 15 6.42172 15.4214 5.67157 16.1716C4.92143 16.9217 4.5 17.9391 4.5 19V21" stroke="#18191F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12.5 11C14.7091 11 16.5 9.20914 16.5 7C16.5 4.79086 14.7091 3 12.5 3C10.2909 3 8.5 4.79086 8.5 7C8.5 9.20914 10.2909 11 12.5 11Z" stroke="#18191F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="Email address">
                </div>
                <div class="form-group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="24" viewBox="0 0 25 24" fill="none">
                        <path d="M19.5 11H5.5C4.39543 11 3.5 11.8954 3.5 13V20C3.5 21.1046 4.39543 22 5.5 22H19.5C20.6046 22 21.5 21.1046 21.5 20V13C21.5 11.8954 20.6046 11 19.5 11Z" stroke="#18191F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7.5 11V7C7.5 5.67392 8.02678 4.40215 8.96447 3.46447C9.90215 2.52678 11.1739 2 12.5 2C13.8261 2 15.0979 2.52678 16.0355 3.46447C16.9732 4.40215 17.5 5.67392 17.5 7V11" stroke="#18191F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Password">
                </div>
                <button type="submit" class="btn-login">Continue
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="24" viewBox="0 0 25 24" fill="none" style="vertical-align: middle; margin-left: 8px;">
                        <path d="M10.5 18L16.5 12L10.5 6" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="login-links">
                    <span class="forgot-password">Forgot Password?</span>
                    <span class="contact-admin">&nbsp;Contact your administrator</span>
                </div>
            </form>
            </div>
    </div>
</div>

{% endblock %}
