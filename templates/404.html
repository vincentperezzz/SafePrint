{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="icon" href="{% static 'assets/safeprint-logo.ico' %}" type="image/x-icon">
    <title>404 - Page Not Found</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2em;
        }

        .error-box {
            max-width: 600px;
            width: 90vw;
            min-width: 260px;
            border: 2px solid #222;
            border-radius: 18px;
            background: #fff;
            padding: 2em 2.5em;
            text-align: center;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.12);
        }

        .error-content {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 1em;
        }

        .error-code {
            background: #FFC72C;
            color: #222;
            font-size: 2.5em;
            font-weight: bold;
            border-radius: 8px;
            display: inline-block;
            padding: 5px 10px;
            width: fit-content;
        }

        .error-title {
            background: #FFC72C;
            color: #222;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            display: inline-block;
            padding: 5px 8px;
            width: fit-content;
        }

        .error-sub {
            color: #444;
            background: #f5f5f5;
            border-radius: 8px;
            display: inline-block;
            padding: 5px 8px;
            font-size: 1.1em;
            width: fit-content;
            margin-top: 4px;
        }

        .error-img {
            width: 220px;
            margin: 1em auto 0;
            display: block;
        }

        .home-btn {
            display: inline-block;
            margin-top: 1.5em;
            padding: 12px 28px;
            background: #FFC72C;
            color: #222;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: 2px solid #222;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0px 4px 0px 0px #18191F;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 0px 0px #18191F;
        }

        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0px 2px 0px 0px #18191F;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-content">
            <div class="error-title">Oops! Page not found</div>
            <div class="error-sub">The page you're looking for doesn't exist or has been moved.</div>
        </div>
        <img src="{% static 'assets/404-illus.png' %}" alt="404 illustration" class="error-img">
        <a href="/" class="home-btn">Go to Homepage</a>
    </div>
</body>
</html>
