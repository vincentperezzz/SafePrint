{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafePrint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="navbar-brand">
                <img src="{% static 'img/nanoprint-logo.png' %}" alt="NanoPrint Logo" class="logo">
                <div class="brand-text">
                    <span class="brand-title">NanoPrint</span>
                    <small class="brand-subtitle">Powered by SafePrint</small>
                </div>
            </div>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Help</a></li>
                <li class="nav-item"><a class="nav-link" href="#">FAQs</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About us</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Employee Login</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Feedback</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact us</a></li>
            </ul>
        </nav>
    </header>
    <main>
    {% block content %}
    {% endblock %}
    </main>
    <footer class="footer">
        <p>&copy; 2023 SafePrint. All rights reserved.</p>
    </footer>
</body>
</html>
