{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" href="{% static 'assets/safeprint-logo.ico' %}" type="image/x-icon">
    <title>{% block title %}SafePrint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20260315o">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="max-width">
                <a class="navbar-brand" href="{% url 'home' %}" title="SafePrint HomePage">
                    <img src="{% static 'assets/safeprint-logo.png' %}" alt="SafePrint Logo" class="logo">
                    <div class="brand-text">
                        <span class="brand-title">SafePrint</span>
                        <span class="brand-subtitle">Printing Vendo</span>
                    </div>
                </a>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <ul class="menu">
                    <li><a href="{% url 'home' %}#help" class="menu-btn">Help</a></li>
                    <li><a href="{% url 'home' %}#faqs" class="menu-btn">FAQs</a></li>
                    <li><a href="{% url 'home' %}#about-us" class="menu-btn">About Us</a></li>
                    <li><a href="{% url 'track_status' %}" class="menu-btn">Track Status</a></li>
                    <li><a href="{% url 'home' %}#feedback" class="menu-btn">Feedback</a></li>
                    <li><a href="{% url 'home' %}#contact-us" class="menu-btn">Contact Us</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="main">
    {% block content %}
    {% endblock %}
    </main>
    <div id="loading-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>
    <script src="{% static 'js/scripts.js' %}?v=20260315f"></script>
</body>
</html>
