{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" href="{% static 'assets/nanoprint-logo.png' %}" type="image/x-icon">
    <title>{% block title %}SafePrint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="max-width">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'assets/nanoprint-logo.png' %}" alt="NanoPrint Logo" class="logo">
                    <div class="brand-text">
                        <span class="brand-title">NanoPrint</span>
                        <span class="brand-subtitle">Powered by SafePrint</span>
                    </div>
                </a>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <ul class="menu">
                    <li><a href="#help" class="menu-btn">Help</a></li>
                    <li><a href="#faqs" class="menu-btn">FAQs</a></li>
                    <li><a href="#about-us" class="menu-btn">About Us</a></li>
                    <li><a href="#employee-login" class="menu-btn">Employee Login</a></li>
                    <li><a href="#feedback" class="menu-btn">Feedback</a></li>
                    <li><a href="#contact-us" class="menu-btn">Contact Us</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main class="main">
    {% block content %}
    {% endblock %}
    </main>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
