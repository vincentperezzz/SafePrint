{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://code.jquery.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="icon" href="{% static 'assets/safeprint-logo.ico' %}" type="image/x-icon">
    <title>{% block title %}SafePrint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=20260208">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Vertical Navbar -->
        <nav class="vertical-navbar">
            <div class="navbar-logo">
                <img src="{% static 'assets/safeprint-logo.png' %}" alt="SafePrint Logo">
                <div class="brand-text">
                    <span class="brand-title">SafePrint</span>
                    <span class="brand-subtitle">Printing Vendo</span>
                </div>
            </div>
            <ul class="navbar-menu">
                <li><a href="{% url 'dashboard' %}" class="navbar-item {% if 'dashboard' in request.path %}active{% endif %}">
                    <img src="{% static 'assets/dashboard.svg' %}" alt="Dashboard Icon"> Dashboard</a></li>
                <li><a href="{% url 'printing_queue' %}" class="navbar-item {% if 'queue' in request.path %}active{% endif %}">
                    <img src="{% static 'assets/printing-queue.svg' %}" alt="Printing Queue Icon"> Print Queue</a></li>
                <li><a href="{% url 'print_completed' %}" class="navbar-item {% if 'completed' in request.path %}active{% endif %}">
                    <img src="{% static 'assets/print-completed.svg' %}" alt="Print Completed Icon"> Print Completed</a></li>
                <li><a href="{% url 'printer_status' %}" class="navbar-item {% if 'status' in request.path %}active{% endif %}">
                    <img src="{% static 'assets/printer-status.svg' %}" alt="Printer Status Icon"> Printer Status</a></li>
                <li><a href="{% url 'account_settings' %}" class="navbar-item {% if 'settings' in request.path %}active{% endif %}">
                    <img src="{% static 'assets/account-settings.svg' %}" alt="Account Settings Icon"> Account Settings</a></li>
                <li><a href="{% url 'login' %}" class="navbar-item logout">
                    <img src="{% static 'assets/logout.svg' %}" alt="Logout Icon"> Log out</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
{% block modals %}{% endblock %}
<script src="{% static 'js/admin.js' %}?v=20260209"></script>
</body>
</html>
