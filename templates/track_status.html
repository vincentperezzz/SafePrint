{% extends "layout.html" %}
{% load static %}

{% block title %}Track Status - SafePrint{% endblock %}

{% block content %}
<div class="track-status-page">
    <div class="track-status-card">
        <div class="track-status-header">
            <h2 class="track-status-title">Track Your Print Status</h2>
            <p class="track-status-subtitle">Enter your Customer ID to check your printing progress.</p>
        </div>

        <form id="track-status-form" class="track-status-form">
            {% csrf_token %}
            <div class="track-status-input-group">
                <label for="track-cid-input" class="track-status-label">Customer ID</label>
                <input 
                    type="text" 
                    id="track-cid-input" 
                    class="track-status-input" 
                    placeholder="e.g. CID-1234" 
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                >
            </div>
            <button type="submit" class="track-status-btn">Track Status</button>
        </form>

        <div id="track-status-error" class="track-status-error" style="display: none;">
            No printing session found for this Customer ID.
        </div>
    </div>
</div>

<script>
document.getElementById('track-status-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const cid = document.getElementById('track-cid-input').value.trim();
    const errorDiv = document.getElementById('track-status-error');
    const btn = document.querySelector('.track-status-btn');
    
    if (!cid) return;

    // Hide previous error
    errorDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking...';

    fetch('/api/validate-cid/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customer_id: cid })
    })
    .then(res => res.json())
    .then(data => {
        if (data.valid) {
            // CID exists and session is bound — redirect to confirmation
            window.location.href = '/confirmation/' + encodeURIComponent(cid) + '/';
        } else {
            errorDiv.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Track Status';
        }
    })
    .catch(() => {
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Track Status';
    });
});
</script>
{% endblock %}
